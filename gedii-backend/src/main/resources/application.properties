spring.application.name=gedii-backend

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require&prepareThreshold=0
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# JWT
jwt.secret=GediiMincomSecretKey2026TresLongueEtStablePourJWT123456789
jwt.expiration=86400000

# Compte Responsable initial (cree automatiquement au premier demarrage)
responsable.init.email=${RESPONSABLE_EMAIL}
responsable.init.password=${RESPONSABLE_PASSWORD}
responsable.init.nom=${RESPONSABLE_NOM}
responsable.init.matricule=${RESPONSABLE_MATRICULE}

# Configuration Email via Gmail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=ngdani116@gmail.com
spring.mail.password=jamqlxiyblsuriea
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Debug mail (a retirer en production)
spring.mail.properties.mail.smtp.debug=true
logging.level.org.springframework.mail=DEBUG

supabase.url=${SUPABASE_URL}
supabase.service-key=${SUPABASE_SERVICE_KEY}
supabase.bucket=${SUPABASE_BUCKET}

# Taille max upload (5 MB)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB