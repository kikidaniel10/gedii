spring.application.name=gedii-backend

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require&prepareThreshold=0
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# JWT
jwt.secret=GediiMincomSecretKey2026TresLongueEtStablePourJWT123456789
jwt.expiration=86400000

# Compte Responsable initial (cree automatiquement au premier demarrage)
responsable.init.email=${RESPONSABLE_EMAIL}
responsable.init.password=${RESPONSABLE_PASSWORD}
responsable.init.nom=${RESPONSABLE_NOM}
responsable.init.matricule=${RESPONSABLE_MATRICULE}
