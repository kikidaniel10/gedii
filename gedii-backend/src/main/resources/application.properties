spring.application.name=gedii-backend

spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

server.port=8080

# JWT
jwt.secret=GediiMincomSecretKey2026TresLongueEtStablePourJWT123456789
jwt.expiration=86400000

# Compte Responsable initial
responsable.init.email=${RESPONSABLE_EMAIL}
responsable.init.password=${RESPONSABLE_PASSWORD}
responsable.init.nom=${RESPONSABLE_NOM}
responsable.init.matricule=${RESPONSABLE_MATRICULE}

# SMTP Gmail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Supabase Storage
supabase.url=${SUPABASE_URL}
supabase.service-key=${SUPABASE_SERVICE_KEY}
supabase.bucket=${SUPABASE_BUCKET}

# URL du frontend
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# Taille max upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB